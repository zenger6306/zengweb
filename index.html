<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>专业网站首页</title>
    <style>
        /* 全局样式 */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        h1, h2, h3 {
            margin: 0;
        }
        
        /* 导航栏样式 */
        nav {
            background-color: #2c3e50;
            padding: 15px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }
        nav a:hover {
            text-decoration: underline;
        }

        /* 横幅大图样式 */
        .hero {
            background-image: url('https://via.placeholder.com/1920x800');
            background-size: cover;
            background-position: center;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
        }
        .hero h1 {
            font-size: 50px;
            margin: 0;
        }
        .hero p {
            font-size: 18px;
        }

        /* 服务部分样式 */
        .services {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
        }
        .service-item {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 30%;
            text-align: center;
        }
        .service-item h3 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .service-item p {
            font-size: 16px;
            color: #7f8c8d;
        }

        /* 联系我们部分样式 */
        .contact {
            background-color: #2c3e50;
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }
        .contact h2 {
            font-size: 36px;
        }
        .contact p {
            font-size: 18px;
            margin: 20px 0;
        }
        .contact a {
            background-color: #e74c3c;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }
        .contact a:hover {
            background-color: #c0392b;
        }

        /* 页脚样式 */
        footer {
            background-color: #34495e;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <a href="#">首页</a>
        <a href="#">关于我们</a>
        <a href="#">服务</a>
        <a href="#">联系我们</a>
    </nav>

    <!-- 横幅大图 -->
    <div class="hero">
        <div>
            <h1>欢迎来到我们的专业网站</h1>
            <p>我们为您提供优质的服务与解决方案</p>
        </div>
    </div>

    <!-- 服务部分 -->
    <section class="services">
        <div class="service-item">
            <h3>网站设计</h3>
            <p>我们为您量身定制现代化、响应式的网站设计，提升用户体验。</p>
        </div>
        <div class="service-item">
            <h3>品牌营销</h3>
            <p>通过专业的品牌策略，帮助您在竞争激烈的市场中脱颖而出。</p>
        </div>
        <div class="service-item">
            <h3>SEO优化</h3>
            <p>我们提供全面的SEO优化服务，助您网站在搜索引擎中排名靠前。</p>
        </div>
    </section>

    <!-- 联系我们部分 -->
    <section class="contact">
        <h2>联系我们</h2>
        <p>如果您有任何问题或需求，请随时与我们联系。</p>
        <a href="mailto:contact@yourwebsite.com">发送邮件</a>
    </section>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2025 Your Website. All rights reserved.</p>
    </footer>

</body>
</html>
